[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amsc-poc"
version = "0.1.0"
description = "V1 proof of concept for adaptive multi-signal semantic chunking"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "tiktoken>=0.7,<1",
]

[project.optional-dependencies]
model = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8,<10"]

[project.scripts]
amsc = "amsc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]

