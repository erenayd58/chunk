benchmark:
  version: phase4-v1
  status: development_checkpoint

source:
  units: data/kkb-2024.units.jsonl
  units_sha256: 2776742d5bddad7dcf2a03320dca36e6b384e2ba042ab99ccdecce61612720d5
  gold_queries: evaluation/kkb-2024/retrieval-benchmark/gold-queries.json

candidates:
  legacy:
    kind: public_chat_rag_compatibility_adapter
    source_repository: https://github.com/MurselTasgin/chat_rag
    source_commit: 3fbe307c4d68eedcfb9cdaf14a73ca34eab14bcf
    profile: public_code_defaults_on_frozen_canonical_v1
    chunk_size_words: 300
    chunk_overlap_words: 60
    min_chunk_size_words: 50
    sentence_tokenizer: deterministic_punctuation_span_v1
    use_semantic_segmentation: true
    use_embedding_segmentation: false
  v3:
    kind: frozen_jsonl
    chunks: evaluation/kkb-2024/baseline/v3/chunks.jsonl
  v4:
    kind: frozen_jsonl
    chunks: evaluation/kkb-2024/v4-ablation/a4/chunks.jsonl
  c3:
    kind: frozen_jsonl
    chunks: evaluation/kkb-2024/phase3c-semantic-comparators/c3/chunks.jsonl

retrieval_embedding:
  model: intfloat/multilingual-e5-base
  revision: null
  device: auto
  local_files_only: true
  query_prefix: "query: "
  document_prefix: "passage: "
  model_input_limit: 512
  overlength_strategy: sentence_fragment_token_weighted_pooling
  normalize_embeddings: true
  cache_queries: false
  batch_size: 16
  cache_dir: .cache/retrieval-benchmark-v1

bm25:
  tokenizer: unicode_word_casefold_v1
  k1: 1.5
  b: 0.75

rrf:
  rank_constant: 60
  dense_weight: 1.0
  bm25_weight: 1.0
  candidate_pool_size: 100

evaluation:
  top_ks: [1, 3, 5]
  latency_repetitions: 3
  token_counter_encoding: cl100k_base
